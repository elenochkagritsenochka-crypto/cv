<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Резюме — Елена</title>
    <style>
        body {
            margin: 0;
            font-family: "Helvetica Neue", Arial, sans-serif;
            background: #f6f5f2;
        }

        .container {
            max-width: 1000px;
            margin: 70px auto;
            display: flex;
            background: white;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
        }

        /* Левая колонка */
        .left {
            width: 40%;
            background: #a6b49e;
            /* акцентный цвет */
            color: white;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .photo {
            width: 100%;
            height: 320px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 40px;
        }

        .name {
            font-size: 42px;
            margin: 0;
            line-height: 1.1;
        }

        .role {
            font-size: 18px;
            margin-top: 10px;
            opacity: 0.9;
        }

        /* Правая колонка */
        .right {
            width: 60%;
            padding: 70px 60px;
        }

        .section {
            margin-bottom: 60px;
        }

        .section h3 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #888;
            margin-bottom: 20px;
        }

        .section p,
        .section li {
            font-size: 18px;
            line-height: 1.7;
        }

        ul {
            padding-left: 20px;
        }
    </style>
    <!-- <link rel="stylesheet" href="style.css"> -->
</head>

<body>

    <body>

        <div class="container">

            <div class="container">

                <div class="left">
                    <div>
                        <img src="./assets/photo1.jpg" alt="Фото Елены" class="photo">
                        <h1 class="name">Елена Гриценко</h1>
                        <p class="role">Веб-дизайнер</p>
                    </div>

                    <div>
                        <p>Email: example@email.com</p>
                        <p>Telegram: @username</p>
                    </div>
                </div>

                <div class="right">

                    <div class="section">
                        <h3>Обо мне</h3>
                        <p>
                            Создаю минималистичные и функциональные интерфейсы.
                            Уделяю внимание типографике и композиции.
                        </p>
                    </div>

                    <div class="section">
                        <h3>Навыки</h3>
                        <ul>
                            <li>HTML / CSS</li>
                            <li>Figma</li>
                            <li>Типографика</li>
                        </ul>
                    </div>

                    <div class="section">
                        <h3>Проекты</h3>
                        <p>Учебный лендинг</p>
                        <p>Текстовые композиции</p>
                    </div>

                </div>

            </div>
    </body>

</html>
